site_name: Swirrl
site_url: https://astrve.github.io/swirrl/
repo_url: https://github.com/astrve/swirrl
repo_name: astrve/swirrl

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate

nav:
  - Home: Home.md
  - Getting Started:
    - Installation: Installation.md
    - Quick Start: Quick-Start.md
    - Configuration: Configuration.md
    - Security: Security.md
  - Pipeline:
    - Overview: Pipeline.md
    - Presets: Presets.md
  - CLI Reference: CLI-Reference.md
  - Templates: Templates.md
  - Modules:
    - Inspect: modules/Inspect.md
    - Renamer: modules/Renamer.md
    - CleanMKV: modules/CleanMKV.md
    - Metadata: modules/Metadata.md
    - NFO: modules/NFO.md
    - Prez: modules/Prez.md
    - Torrent: modules/Torrent.md
    - Validate: modules/Validate.md
    - Encode: modules/Encode.md
    - Batch: modules/Batch.md
    - Upload: modules/Upload.md
    - Seedbox: modules/Seedbox.md
  - Architecture: Architecture.md
  - Contributing: Contributing.md
  - Changelog:
    - Release 2.0.0: Release-2.0.0.md
    - Roadmap: Roadmap.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

strict: false
