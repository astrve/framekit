name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check src tests --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check src tests

  type-check:
    name: Type Check (Pyright Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pyright
        run: pyright

  service-web-gate:
    name: Service/Web Packaging Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install uv

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend package assets
        run: npm run build

      - name: Run targeted service/web tests
        run: |
          pytest tests/test_web_api.py tests/test_service_events.py tests/test_web_modules_runner.py -q -k "events or service or jobs or watch or intake or retry or restart or claim"

      - name: Build wheel and sdist
        run: uv build --sdist --wheel

      - name: Wheel smoke install + serve
        shell: bash
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -m ouro serve --host 127.0.0.1 --port 8765 > /tmp/ouro-serve.log 2>&1 &
          PID=$!
          sleep 4
          curl -fsS http://127.0.0.1:8765/healthz
          curl -fsS http://127.0.0.1:8765/ | head -n 5
          kill $PID

  pytest-diagnostic:
    name: Pytest Diagnostic (timings/memory/order)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-timeout pytest-randomly

      - name: Capture collect order
        run: pytest tests/test_web_api.py --collect-only -q > pytest-collect-order.txt

      - name: Run diagnostic subset
        run: |
          python -X tracemalloc -m pytest tests/test_web_api.py -q -vv -k "events_recent or events_stream" --durations=25 --timeout=120 > pytest-diagnostic.txt

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostic
          path: |
            pytest-collect-order.txt
            pytest-diagnostic.txt

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix mediainfo
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mkvtoolnix mediainfo
      
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mkvtoolnix mediainfo-cli -y
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      
      - name: Run tests with coverage
        shell: bash
        run: |
          pytest -v \
            --cov=ouro.core.models \
            --cov=ouro.core.subprocess_safe \
            --cov=ouro.core.plugins \
            --cov=ouro.core.runs \
            --cov=ouro.core.audit_log \
            --cov=ouro.modules.metadata.providers.anilist_models \
            --cov=ouro.modules.metadata.providers.tmdb_models \
            --cov=ouro.modules.metadata.providers.trakt_models \
            --cov=ouro.modules.metadata.providers.tvdb_models \
            --cov=ouro.modules.upload.adapters \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --tb=short \
            -n auto \
            --timeout=300
      
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --fail-under=90

  quality-tools:
    name: Quality Tools (xenon/vulture/codespell/interrogate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Xenon
        run: >
          xenon --max-absolute B --max-modules B --max-average A
          src/ouro/core/audit_log.py
          src/ouro/core/runs/ledger.py
          src/ouro/core/runs/rollback.py
          src/ouro/commands/plugin.py
          src/ouro/commands/audit_log.py
          src/ouro/commands/rollback.py

      - name: Run Vulture
        run: vulture src tests --min-confidence 80

      - name: Run Codespell
        run: codespell --toml pyproject.toml .

      - name: Run Interrogate
        run: >
          interrogate
          src/ouro/core/models
          src/ouro/core/security
          src/ouro/core/path_validation.py
          src/ouro/core/subprocess_safe.py
          src/ouro/core/plugins.py
          src/ouro/modules/metadata/providers
          src/ouro/modules/upload/adapters
          src/ouro/modules/upload/service.py
          --fail-under 75

  full-truth:
    name: Full Truth Profile (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full coverage (truth)
        run: |
          pytest -q --cov=src/ouro --cov-branch --cov-report=term-missing

      - name: Full xenon (truth)
        run: |
          xenon --max-absolute B --max-modules A --max-average A src || true

      - name: Full interrogate (truth)
        run: |
          interrogate src --fail-under 75 || true

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify installed dependency graph
        run: pip check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[toml]

      - name: Run pip-audit (dependency vulnerabilities)
        # Temporary exception: interrogate dependency chain currently pulls
        # ``py==1.11.0`` (PYSEC-2022-42969). Re-check monthly and remove this
        # ignore once upstream dependency chain no longer requires ``py``.
        run: pip-audit --desc --ignore-vuln PYSEC-2022-42969

      - name: Run Bandit (code security)
        run: bandit -r src -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-security-report
          path: bandit-report.json

  man-pages:
    name: Build man pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + click-man
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate man pages
        run: |
          mkdir -p dist/man
          PYTHONUTF8=1 python - <<'PY'
          from click_man.core import write_man_pages

          from ouro.commands.main import cli

          write_man_pages("ouro", cli, version="2.0.0", target_dir="dist/man")
          PY
          ls -la dist/man

      - name: Upload man pages
        uses: actions/upload-artifact@v7
        with:
          name: ouro-man-pages
          path: dist/man/*.1

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security, quality-tools, supply-chain, service-web-gate]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Linting failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "Type checking failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security scan failed"
            exit 1
          fi
          if [ "${{ needs.quality-tools.result }}" != "success" ]; then
            echo "Quality tools failed"
            exit 1
          fi
          if [ "${{ needs.supply-chain.result }}" != "success" ]; then
            echo "Supply chain check failed"
            exit 1
          fi
          if [ "${{ needs.service-web-gate.result }}" != "success" ]; then
            echo "Service/web packaging gate failed"
            exit 1
          fi
          echo "All quality checks passed."
