name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check src tests --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check src tests

  type-check:
    name: Type Check (Pyright Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pyright
        run: pyright

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix mediainfo
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mkvtoolnix mediainfo
      
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mkvtoolnix mediainfo-cli -y
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-xdist pytest-timeout
      
      - name: Run tests with coverage
        shell: bash
        run: |
          pytest -v \
            --cov=framekit.core.models \
            --cov=framekit.core.subprocess_safe \
            --cov=framekit.core.plugins \
            --cov=framekit.core.runs \
            --cov=framekit.core.audit_log \
            --cov=framekit.modules.metadata.providers.anilist_models \
            --cov=framekit.modules.metadata.providers.tmdb_models \
            --cov=framekit.modules.metadata.providers.trakt_models \
            --cov=framekit.modules.metadata.providers.tvdb_models \
            --cov=framekit.modules.upload.adapters \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            --tb=short \
            -n auto \
            --timeout=300
      
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage report --fail-under=90

  quality-tools:
    name: Quality Tools (xenon/vulture/codespell/interrogate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Xenon
        run: >
          xenon --max-absolute B --max-modules B --max-average A
          src/framekit/core/audit_log.py
          src/framekit/core/runs/ledger.py
          src/framekit/core/runs/rollback.py
          src/framekit/commands/plugin.py
          src/framekit/commands/audit_log.py
          src/framekit/commands/rollback.py

      - name: Run Vulture
        run: vulture src tests --min-confidence 80

      - name: Run Codespell
        run: codespell --toml pyproject.toml .

      - name: Run Interrogate
        run: >
          interrogate
          src/framekit/core/models
          src/framekit/core/security
          src/framekit/core/path_validation.py
          src/framekit/core/subprocess_safe.py
          src/framekit/core/plugins.py
          src/framekit/modules/metadata/providers
          src/framekit/modules/upload/adapters
          src/framekit/modules/upload/service.py
          --fail-under 75

  full-truth:
    name: Full Truth Profile (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full coverage (truth)
        run: |
          pytest -q --cov=src/framekit --cov-branch --cov-report=term-missing

      - name: Full xenon (truth)
        run: |
          xenon --max-absolute B --max-modules A --max-average A src || true

      - name: Full interrogate (truth)
        run: |
          interrogate src --fail-under 75 || true

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify installed dependency graph
        run: pip check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[toml]

      - name: Run pip-audit (dependency vulnerabilities)
        # Temporary exception: interrogate dependency chain currently pulls
        # ``py==1.11.0`` (PYSEC-2022-42969). Re-check monthly and remove this
        # ignore once upstream dependency chain no longer requires ``py``.
        run: pip-audit --desc --ignore-vuln PYSEC-2022-42969

      - name: Run Bandit (code security)
        run: bandit -r src -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-security-report
          path: bandit-report.json

  man-pages:
    name: Build man pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + click-man
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate man pages
        run: |
          mkdir -p dist/man
          PYTHONUTF8=1 python - <<'PY'
          from click_man.core import write_man_pages

          from framekit.commands.main import cli

          write_man_pages("framekit", cli, version="2.0.0", target_dir="dist/man")
          PY
          ls -la dist/man

      - name: Upload man pages
        uses: actions/upload-artifact@v7
        with:
          name: framekit-man-pages
          path: dist/man/*.1

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security, quality-tools, supply-chain]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Linting failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "Type checking failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security scan failed"
            exit 1
          fi
          if [ "${{ needs.quality-tools.result }}" != "success" ]; then
            echo "Quality tools failed"
            exit 1
          fi
          if [ "${{ needs.supply-chain.result }}" != "success" ]; then
            echo "Supply chain check failed"
            exit 1
          fi
          echo "All quality checks passed."
