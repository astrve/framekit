# VE Only Pipeline Preset (Version Española)
# ===========================================
# Spanish audio only + Spanish subs (forced, full and SDH if available)
# Prez: detailed / NFO: detailed / HTML: Magazine Dark

ve_only:
  name: "VE Only - ES audio + ES subs"
  description: "Keep only Spanish audio and Spanish subtitles (forced/full/SDH), first Spanish subtitle as default"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    external_preset: "ve_only"
    apply_changes: true
    output_dir_name: "Release/{release}"
  nfo:
    template: "detailed"
    locale: "es"
    mode: "global"
    auto_metadata: true
  torrent:
    private: true
  prez:
    format: "both"
    bbcode_template: "detailed"
    html_template: "magazine_dark"
    banner_design: "textual"
    detail_level: "detailed"
    mediainfo_mode: "spoiler"
    show_tmdb: "true"
    show_mediainfo: "true"


