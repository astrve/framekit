name: "Series - h264 to h265"
description: "Optimized preset for TV series (CRF 21, medium, main10)"
aliases:
  - s265
  - serie265
  - tv265
  - s264-265
  - serie264-265
source_codec: h264
target_codec: h265
encoder: libx265

video:
  crf: 21
  preset: medium
  tune: null
  profile: main10
  level: "5.1"
  pix_fmt: yuv420p10le

audio:
  copy: true

subtitles:
  copy: true

metadata:
  preserve: true

chapters:
  preserve: true

advanced:
  two_pass: false
  x265_params:
    - "aq-mode=3"
    - "aq-strength=0.8"
    - "deblock=-1:-1"
