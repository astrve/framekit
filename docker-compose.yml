services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: python -m uvicorn ouro.web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      OURO_CONFIG_DIR: /var/lib/ouro/config
      OURO_CACHE_DIR: /var/lib/ouro/cache
      OURO_LOG_DIR: /var/lib/ouro/logs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ouro_config:/var/lib/ouro/config
      - ouro_cache:/var/lib/ouro/cache
      - ouro_logs:/var/lib/ouro/logs

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_OURO_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./web-ui:/app
      - web_ui_node_modules:/app/node_modules

volumes:
  ouro_config:
  ouro_cache:
  ouro_logs:
  web_ui_node_modules:

