services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: python -m uvicorn framekit.web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      FRAMEKIT_CONFIG_DIR: /var/lib/framekit/config
      FRAMEKIT_CACHE_DIR: /var/lib/framekit/cache
      FRAMEKIT_LOG_DIR: /var/lib/framekit/logs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - framekit_config:/var/lib/framekit/config
      - framekit_cache:/var/lib/framekit/cache
      - framekit_logs:/var/lib/framekit/logs

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_FRAMEKIT_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./web-ui:/app
      - web_ui_node_modules:/app/node_modules

volumes:
  framekit_config:
  framekit_cache:
  framekit_logs:
  web_ui_node_modules:

