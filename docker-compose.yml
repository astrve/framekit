services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: python -m uvicorn swirrl.web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      SWIRRL_CONFIG_DIR: /var/lib/swirrl/config
      SWIRRL_CACHE_DIR: /var/lib/swirrl/cache
      SWIRRL_LOG_DIR: /var/lib/swirrl/logs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - swirrl_config:/var/lib/swirrl/config
      - swirrl_cache:/var/lib/swirrl/cache
      - swirrl_logs:/var/lib/swirrl/logs

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_SWIRRL_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./web-ui:/app
      - web_ui_node_modules:/app/node_modules

volumes:
  swirrl_config:
  swirrl_cache:
  swirrl_logs:
  web_ui_node_modules:

