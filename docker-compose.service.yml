services:
  ouro:
    build:
      context: .
      dockerfile: Dockerfile
    image: ouro-service:local
    environment:
      OURO_CONFIG_DIR: /var/lib/ouro/config
      OURO_CACHE_DIR: /var/lib/ouro/cache
    ports:
      - "8000:8000"
    volumes:
      - ouro_config:/var/lib/ouro/config
      - ouro_cache:/var/lib/ouro/cache
      - ./Workspace:/media
    restart: unless-stopped

volumes:
  ouro_config:
  ouro_cache:
