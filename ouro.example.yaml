# Ouro example configuration.
# Copy to "ouro.yaml" in your working directory, or set OURO_CONFIG.
# Empty strings keep safe defaults or ask interactively when needed.

schema_version: 14

general:
  locale: en
  default_folder: ''
  report_output_folder: ''

logging:
  max_size_mb: 100
  max_backups: 30
  compress_old_logs: true
  retention_days: 5
  cleanup_on_startup: true

tools:
  mkvmerge: ''
  ffmpeg: ''
  ffprobe: ''
  mediainfo: ''

setup:
  completed: false
  prompt_on_start: true

security:
  enabled: true
  vault_path: ''
  key_storage: keyring
  auto_migrate: true
  backup_before_changes: true

metadata:
  provider: tmdb
  fallback_providers: []
  interactive_confirmation: true
  cache_ttl_hours: 168
  language: en-US
  tmdb_read_access_token: ''
  tvdb_api_key: ''
  tvdb_language: eng
  anilist_enabled: true
  anilist_language: en
  trakt_client_id: ''
  trakt_client_secret: ''
  trakt_access_token: ''
  enabled_by_default: true
  prompt_missing_token_in_pipeline: true
  content_type_hints:
    anime:
      - anilist
      - tmdb
    tv:
      - tvdb
      - tmdb
    movie:
      - tmdb

cache:
  enabled: true
  directory: ''
  auto_cleanup: true
  cleanup_on_startup: true
  tmdb:
    enabled: true
    ttl_days: 7
    max_size_mb: 50
  tvdb:
    enabled: true
    ttl_days: 7
    max_size_mb: 50
  anilist:
    enabled: true
    ttl_days: 7
    max_size_mb: 50
  trakt:
    enabled: true
    ttl_days: 7
    max_size_mb: 50
  mediainfo:
    enabled: true
    ttl_days: 30
    max_size_mb: 50
  release:
    enabled: true
    ttl_days: 7
    max_size_mb: 50

modules:
  renamer:
    default_folder: ''
    default_language_tag: MULTI.VFF

  cleanmkv:
    default_folder: ''
    output_dir_name: Release/{release}
    default_preset: multi
    copy_unchanged_files: true

  nfo:
    default_folder: ''
    active_template: default
    locale: auto
    logo_path: ''
    active_logo: ''
    with_metadata: true
    mode: global

  torrent:
    default_folder: ''
    announce: ''
    announce_urls: []
    selected_announce: ''
    private: true
    piece_length: auto
    prompt_save_announce: true

  prez:
    default_folder: ''
    locale: auto
    format: both
    preset: default
    html_template: minimal_dark
    bbcode_template: classic
    mediainfo_mode: none
    include_mediainfo: false
    with_metadata: true

  pipeline:
    default_folder: ''
    stop_on_error: false
    enabled_modules:
      - renamer
      - cleanmkv
      - nfo
      - torrent
      - prez
    with_metadata: true
    auto_mode: false
    upload_on_failure: false
    upload_timeout: 300

  encoder:
    default_folder: ''
    output_dir_name: encoded
    preset: ''
    ffmpeg_path: ffmpeg
    ffprobe_path: ffprobe

upload:
  enabled: false
  auto_upload: false
  max_parallel_uploads: 3
  trackers: []
  image_host: ''
  image_host_api_key: ''
  torrent_client: ''
  torrent_client_host: localhost
  torrent_client_port: 8080
  torrent_client_username: ''
  torrent_client_password: ''
  torrent_client_category: ouro

seedbox:
  default: ''
  history_enabled: true
  seedboxes: []

watch:
  enabled: false
  folders: []
  notifications:
    enabled: true
    on_watch_started: true
    on_start: false
    on_success: false
    on_error: true

plugins:
  allowed: []

aliases:
  enabled: true
  max_chain_depth: 5
  user: {}
  builtin: {}
