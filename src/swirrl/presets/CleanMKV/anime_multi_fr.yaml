# Anime MULTI (FR) CleanMKV Preset
# =================================
# Keep all tracks, French audio default, first French subtitle as default (forced preferred)

anime_multi_fr:
  name: "Anime MULTI (FR) - FR audio default, FR sub default, keep all"
  keep_audio_filters: []
  default_audio_filter: "french"
  keep_subtitle_filters: []
  keep_subtitle_variants: []
  default_subtitle_filter: "french"
  default_subtitle_variant: null
  audio_default_explicit: true
  subtitle_default_explicit: true

