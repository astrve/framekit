# Anime VO (MULTI) CleanMKV Preset
# =================================
# Keep all tracks, Japanese audio default, English subtitle default

anime_vo_multi:
  name: "Anime VO (MULTI) - JP audio default, EN sub default, keep all"
  keep_audio_filters: []
  default_audio_filter: "japanese"
  keep_subtitle_filters: []
  keep_subtitle_variants: []
  default_subtitle_filter: "english"
  default_subtitle_variant: null
  audio_default_explicit: true
  subtitle_default_explicit: true

