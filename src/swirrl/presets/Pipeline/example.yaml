# Pipeline Preset Examples
# ========================
# This file contains example presets for the Pipeline module.
# Pipeline presets define complete workflows that combine multiple modules
# (Renamer, CleanMKV, NFO, Torrent, Prez) into automated release processing.

# ==============================================================================
# PRESET STRUCTURE
# ==============================================================================
# Each pipeline preset contains the following fields:
#
# name: (string, required)
#   Display name for the pipeline preset
#
# description: (string, optional)
#   Description of what this pipeline does
#
# modules: (list of strings)
#   Which modules to run in the pipeline
#   Valid modules: "renamer", "cleanmkv", "nfo", "torrent", "prez"
#   Modules run in the order specified
#
# MODULE-SPECIFIC CONFIGURATIONS:
#
# renamer: (object, optional)
#   Configuration for the Renamer module
#   - auto_detect: (boolean) Auto-detect release type
#   - rules: (list) Custom renaming rules
#
# cleanmkv: (object, optional)
#   Configuration for the CleanMKV module
#   - preset: (string) CleanMKV preset name
#   - external_preset: (string) External preset file
#   - apply_changes: (boolean) Apply changes or dry-run
#   - output_dir_name: (string) Output directory name
#
# nfo: (object, optional)
#   Configuration for the NFO module
#   - template: (string) NFO template name
#   - locale: (string) NFO locale (en, fr, es)
#   - auto_metadata: (boolean) Auto-fetch metadata
#
# torrent: (object, optional)
#   Configuration for the Torrent module
#   - tracker: (string) Tracker name/URL
#   - private: (boolean) Private torrent flag
#
# prez: (object, optional)
#   Configuration for the Prez module
#   - preset: (string) Prez preset name
#   - format: (string) Output format (html, bbcode, both)
#   - html_template: (string) HTML template name
#   - bbcode_template: (string) BBCode template name

# ==============================================================================
# EXAMPLE 1: Complete Release Pipeline
# ==============================================================================
# Full pipeline for creating a complete release package.
# Runs all modules in sequence: rename, clean, NFO, torrent, presentation.

complete_release:
  name: "Complete Release Pipeline"
  description: "Full workflow for creating a complete release package"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    preset: "keep_all"
    apply_changes: true
    output_dir_name: "Clean"
  nfo:
    template: "movie_default"
    locale: "en"
    auto_metadata: true
  torrent:
    private: true
  prez:
    preset: "default"
    format: "both"

