# ==============================================================================
# USAGE NOTES
# ==============================================================================
#
# 1. USING PIPELINE PRESETS:
#    - Command line: swirrl pipeline --preset complete_release
#    - Settings file: Set default preset in swirrl.yaml
#
# 2. MODULE EXECUTION ORDER:
#    - Modules run in the order specified in the "modules" list
#    - Typical order: renamer → cleanmkv → nfo → torrent → prez
#    - You can skip modules by removing them from the list
#
# 3. MODULE DEPENDENCIES:
#    - NFO module requires metadata (auto-fetched or manual)
#    - Prez module requires NFO data
#    - Torrent module requires cleaned files
#
# 4. CUSTOM PRESETS:
#    - Create custom presets by copying and modifying these examples
#    - Save as YAML files in Presets/Pipeline/
#    - Reference by filename: swirrl pipeline --preset my_custom_pipeline
#
# 5. COMBINING WITH MODULE PRESETS:
#    - Pipeline presets can reference CleanMKV and Prez presets
#    - Use "preset" for built-in presets
#    - Use "external_preset" for custom presets
#
# 6. DRY RUN MODE:
#    - Set apply_changes: false in cleanmkv config for dry run
#    - Useful for testing pipelines before applying changes
#
# 7. BATCH PROCESSING:
#    - Use --batch flag to process multiple releases
#    - Pipeline preset applies to all releases in batch
#
# 8. ERROR HANDLING:
#    - Pipeline stops on first error by default
#    - Use --continue-on-error flag to process remaining items
#
# 9. CONFIGURATION PRIORITY:
#    - Command-line flags override preset values
#    - Preset values override settings file values
#    - Settings file values are defaults
#
# 10. MODULE-SPECIFIC OPTIONS:
#     - Each module section supports its command-line options
#     - See individual module documentation for all options
#     - Example: cleanmkv supports preset, external_preset, apply_changes, etc.
#
# ==============================================================================
# CREATING CUSTOM PIPELINES
# ==============================================================================
#
# To create a custom pipeline:
#
# 1. Copy an example preset that's closest to your needs
# 2. Modify the name and description
# 3. Adjust the modules list (add/remove/reorder)
# 4. Configure each module's settings
# 5. Save as a new YAML file in Presets/Pipeline/
# 6. Test with dry run first: swirrl pipeline --preset my_preset --dry-run
# 7. Apply when ready: swirrl pipeline --preset my_preset --apply
#
# Example custom pipeline:
#
# my_custom_pipeline:
#   name: "My Custom Pipeline"
#   description: "Custom workflow for my specific needs"
#   modules:
#     - "cleanmkv"
#     - "nfo"
#     - "prez"
#   cleanmkv:
#     external_preset: "my_cleanmkv_preset"
#     apply_changes: true
#   nfo:
#     template: "movie_default"
#     locale: "en"
#     auto_metadata: true
#   prez:
#     preset: "tracker"
#     format: "bbcode"



