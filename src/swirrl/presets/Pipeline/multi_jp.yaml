# MULTI.JP Pipeline Preset
# =========================
# Keep all tracks, Japanese audio default, first Japanese subtitle as default
# Prez: detailed / NFO: detailed / HTML: Magazine Dark

multi_jp:
  name: "MULTI.JP - All tracks, JP audio default, JP sub default"
  description: "Keep all audio/subtitle tracks, Japanese audio as default, first Japanese subtitle as default (forced preferred)"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    external_preset: "multi_jp"
    apply_changes: true
    output_dir_name: "Release/{release}"
  nfo:
    template: "detailed"
    locale: "en"
    mode: "global"
    auto_metadata: true
  torrent:
    private: true
  prez:
    format: "both"
    bbcode_template: "detailed"
    html_template: "magazine_dark"
    banner_design: "textual"
    detail_level: "detailed"
    mediainfo_mode: "spoiler"
    show_tmdb: "true"
    show_mediainfo: "true"


