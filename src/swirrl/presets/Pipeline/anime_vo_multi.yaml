# Anime VO (MULTI) Pipeline Preset
# =================================
# Keep all tracks, Japanese audio default, English subtitle default
# Prez: detailed / NFO: detailed / HTML: Magazine Dark

anime_vo_multi:
  name: "Anime VO (MULTI) - JP audio, EN sub default, keep all"
  description: "Keep all audio/subtitle tracks, Japanese audio as default, English subtitle as default"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    external_preset: "anime_vo_multi"
    apply_changes: true
    output_dir_name: "Release/{release}"
  nfo:
    template: "detailed"
    locale: "en"
    mode: "global"
    auto_metadata: true
  torrent:
    private: true
  prez:
    format: "both"
    bbcode_template: "detailed"
    html_template: "magazine_dark"
    banner_design: "textual"
    detail_level: "detailed"
    mediainfo_mode: "spoiler"
    show_tmdb: "true"
    show_mediainfo: "true"


