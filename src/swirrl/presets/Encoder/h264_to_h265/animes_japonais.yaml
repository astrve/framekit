name: "Animes Japonais - h264 to h265"
description: "Optimized preset for Japanese anime (CRF 19, veryslow, tune animation, main10)"
aliases:
  - a265
  - anime265
  - jp265
  - a264-265
  - anime264-265
source_codec: h264
target_codec: h265
encoder: libx265

video:
  crf: 19
  preset: veryslow
  tune: animation
  profile: main10
  level: "5.1"
  pix_fmt: yuv420p10le

audio:
  copy: true

subtitles:
  copy: true

metadata:
  preserve: true

chapters:
  preserve: true

advanced:
  two_pass: false
  x265_params:
    - "aq-mode=3"
    - "aq-strength=0.8"
    - "deblock=-2:-2"
    - "psy-rd=1.5"
    - "psy-rdoq=1.0"
    - "bframes=8"
