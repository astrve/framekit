# ==============================================================================
# HTML TEMPLATE DESCRIPTIONS
# ==============================================================================
# aurora: Modern, clean design with gradient accents
# emerald: Green-themed elegant presentation
# midnight: Dark theme with blue accents
# cinema: Movie theater aesthetic with dramatic styling
# poster: Poster-focused layout emphasizing cover art
# minimal: Clean, minimalist design
# neon: Vibrant neon-themed presentation
# mono: Monochrome, typography-focused design
# editorial: Magazine-style editorial layout
# lobby: Cinema lobby-inspired design
# vertical: Vertical scrolling layout
# terminal: Terminal/console-inspired technical design
# magazine: Magazine-style multi-column layout
# split: Split-screen design
# magazine_dark: Editorial presentation
# poster_focus: Enhanced poster-focused layout
# timeline: Timeline-style chronological presentation
# timeline_noir: Dark-themed timeline
# timeline_amber: Warm-themed timeline
# timeline_ocean: Cool-themed timeline

# ==============================================================================
# BBCODE TEMPLATE DESCRIPTIONS
# ==============================================================================
# classic: Traditional BBCode format, widely compatible
# compact: Minimal BBCode for quick posts
# detailed: Comprehensive BBCode with all information
# technical: Technical specifications focus
# cinematic: Dramatic, movie-focused BBCode
# tracker: Optimized for torrent tracker requirements
# spoiler: All content in spoiler tags
# boxed: Boxed/bordered sections for organization

# ==============================================================================
# USAGE NOTES
# ==============================================================================
#
# 1. USING PRESETS:
#    - Command line: framekit prez --preset tracker
#    - Settings file: Set default preset in framekit.yaml
#
# 2. OVERRIDING PRESET VALUES:
#    - You can override individual preset values with command-line flags
#    - Example: framekit prez --preset tracker --html-template cinema
#
# 3. CUSTOM PRESETS:
#    - Create custom presets by copying and modifying these examples
#    - Save as YAML files in Presets/Prez/
#    - Reference by filename: framekit prez --preset my_custom_preset
#
# 4. TEMPLATE SELECTION:
#    - HTML templates control the visual design of HTML output
#    - BBCode templates control forum post formatting
#    - Choose templates that match your target platform
#
# 5. MEDIAINFO MODES:
#    - "none": Best for casual sharing, cleaner presentation
#    - "inline": Best for technical audiences who want immediate access
#    - "spoiler": Best for forums, keeps presentation clean
#    - "file": Best when MediaInfo needs to be separate
#
# 6. DETAIL LEVELS:
#    - "compact": Quick overview, minimal space
#    - "standard": Balanced for general use
#    - "detailed": Comprehensive information
#    - "technical": For technical audiences
#    - "premium": High-quality, all details
#    - "tracker": Meets tracker requirements
#    - "timeline": Chronological presentation
#
# 7. COMBINING WITH OTHER MODULES:
#    - Prez works with NFO and metadata modules
#    - Use pipeline presets to combine multiple modules
#    - See Presets/Pipeline/example.yaml for pipeline examples
