# Prez Preset Examples
# ====================
# This file contains example presets for the Prez (Presentation) module.
# Prez presets control how release presentations are generated, including
# template selection, MediaInfo display options, and detail levels.

# ==============================================================================
# PRESET STRUCTURE
# ==============================================================================
# Each preset contains the following fields:
#
# format: (string)
#   Output format(s) to generate
#   Valid values: "html", "bbcode", "both", "mediainfo"
#   - "html": Generate HTML presentation only
#   - "bbcode": Generate BBCode presentation only
#   - "both": Generate both HTML and BBCode
#   - "mediainfo": Generate MediaInfo text only (no presentation)
#
# html_template: (string)
#   HTML template to use for presentation
#   Available templates: aurora, emerald, midnight, cinema, poster, minimal,
#   neon, mono, editorial, lobby, vertical, terminal, magazine, split,
#   magazine_dark, poster_focus, timeline, timeline_noir, timeline_amber, timeline_ocean
#
# bbcode_template: (string)
#   BBCode template to use for presentation
#   Available templates: classic, compact, detailed, technical, cinematic,
#   tracker, spoiler, boxed
#
# mediainfo_mode: (string)
#   How to display MediaInfo in the presentation
#   Valid values: "none", "inline", "spoiler", "file"
#   - "none": Don't include MediaInfo
#   - "inline": Include MediaInfo directly in presentation
#   - "spoiler": Include MediaInfo in a spoiler/collapsible section
#   - "file": Save MediaInfo to a separate file
#
# detail_level: (string)
#   Level of detail to include in presentation
#   Valid values: "compact", "standard", "detailed", "technical", "premium",
#   "tracker", "timeline"
#   - "compact": Minimal information, quick overview
#   - "standard": Balanced information for general use
#   - "detailed": Comprehensive information
#   - "technical": Technical specifications focus
#   - "premium": High-quality presentation with all details
#   - "tracker": Optimized for torrent tracker requirements
#   - "timeline": Timeline-style presentation
#
# show_tmdb: (string, "true" or "false")
#   Whether to include TMDB (The Movie Database) information
#
# show_mediainfo: (string, "true" or "false")
#   Whether to include MediaInfo technical details

# ==============================================================================
# EXAMPLE 1: Default Preset
# ==============================================================================
# Balanced preset suitable for most use cases.
# Generates both HTML and BBCode with standard detail level.

default:
  format: "both"
  html_template: "aurora"
  bbcode_template: "classic"
  mediainfo_mode: "none"
  detail_level: "standard"
  show_tmdb: "true"
  show_mediainfo: "false"

# ==============================================================================
# EXAMPLE 2: Tracker Preset
# ==============================================================================
# Optimized for torrent tracker uploads.
# Includes MediaInfo in spoiler, BBCode format, tracker-specific details.

