# MULTI.ES Pipeline Preset
# =========================
# Keep all tracks, Spanish audio default, first Spanish subtitle as default
# Prez: detailed / NFO: detailed / HTML: Magazine Dark

multi_es:
  name: "MULTI.ES - All tracks, ES audio default, ES sub default"
  description: "Keep all audio/subtitle tracks, Spanish audio as default, first Spanish subtitle as default (forced preferred)"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    external_preset: "multi_es"
    apply_changes: true
    output_dir_name: "Release/{release}"
  nfo:
    template: "detailed"
    locale: "es"
    mode: "global"
    auto_metadata: true
  torrent:
    private: true
  prez:
    format: "both"
    bbcode_template: "detailed"
    html_template: "magazine_dark"
    banner_design: "textual"
    detail_level: "detailed"
    mediainfo_mode: "spoiler"
    show_tmdb: "true"
    show_mediainfo: "true"


