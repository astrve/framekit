# MULTI.FR Pipeline Preset
# =========================
# Keep all tracks, French audio default, first French subtitle as default
# Prez: detailed / NFO: detailed / HTML: Magazine Dark

multi_fr:
  name: "MULTI.FR - All tracks, FR audio default, FR sub default"
  description: "Keep all audio/subtitle tracks, French audio as default, first French subtitle as default (forced preferred)"
  modules:
    - "renamer"
    - "cleanmkv"
    - "nfo"
    - "torrent"
    - "prez"
  renamer:
    auto_detect: true
  cleanmkv:
    external_preset: "multi_fr"
    apply_changes: true
    output_dir_name: "Release/{release}"
  nfo:
    template: "detailed"
    locale: "fr"
    mode: "global"
    auto_metadata: true
  torrent:
    private: true
  prez:
    format: "both"
    bbcode_template: "detailed"
    html_template: "magazine_dark"
    banner_design: "textual"
    detail_level: "detailed"
    mediainfo_mode: "spoiler"
    show_tmdb: "true"
    show_mediainfo: "true"


