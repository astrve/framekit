# Anime MULTI (EN) CleanMKV Preset
# =================================
# Keep all tracks, English audio default, English subtitle default

anime_multi_en:
  name: "Anime MULTI (EN) - EN audio default, EN sub default, keep all"
  keep_audio_filters: []
  default_audio_filter: "english"
  keep_subtitle_filters: []
  keep_subtitle_variants: []
  default_subtitle_filter: "english"
  default_subtitle_variant: "forced"
  audio_default_explicit: true
  subtitle_default_explicit: true

